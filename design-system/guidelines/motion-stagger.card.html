<!-- @dsCard group="Motion" viewport="700x230" name="Stagger — Hasil Sparing Matcher" subtitle="Baris ranking muncul fade+rise berurutan, jeda 60ms" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
body{padding:16px 24px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.title{font:var(--text-label);color:var(--pk-text)}
.replay{font:var(--text-caption);color:var(--pk-accent-fg);background:none;border:1px solid var(--pk-border);border-radius:var(--radius-md);padding:5px 12px;cursor:pointer}
.rows{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:14px;background:var(--pk-surface);border:1px solid var(--pk-border);border-radius:var(--radius-md);padding:10px 14px;box-shadow:var(--elevation-1);
  opacity:0;transform:translateY(10px)}
.row.in{opacity:1;transform:none;transition:opacity var(--dur-component) var(--ease-out), transform var(--dur-component) var(--ease-out)}
.av{width:34px;height:34px;border-radius:50%;background:var(--pk-primary);color:#F1F5F9;display:flex;align-items:center;justify-content:center;font:var(--text-caption);flex:none}
.nm{flex:1;font:var(--text-body-sm);color:var(--pk-text)}
.sc{font:700 1.1rem/1 var(--font-heading);color:var(--pk-accent-fg)}
</style></head><body>
<div class="top"><span class="title">4 lawan cocok · diurutkan skor</span><button class="replay" id="rp">↻ Replay</button></div>
<div class="rows" id="rows">
  <div class="row"><span class="av">RW</span><span class="nm">Raka Wijaya · 78 kg</span><span class="sc">92%</span></div>
  <div class="row"><span class="av">DA</span><span class="nm">Dimas Aryo · 76 kg</span><span class="sc">88%</span></div>
  <div class="row"><span class="av">FN</span><span class="nm">Fajar Nugroho · 80 kg</span><span class="sc">81%</span></div>
  <div class="row"><span class="av">BP</span><span class="nm">Bagas Prasetyo · 74 kg</span><span class="sc">76%</span></div>
</div>
<script>
const rows=[...document.querySelectorAll('.row')];
function play(){rows.forEach(r=>r.classList.remove('in'));
setTimeout(()=>rows.forEach((r,i)=>setTimeout(()=>r.classList.add('in'),i*60)),80);}
document.getElementById('rp').onclick=play;play();
</script>
</body></html>
