<!-- @dsCard group="Colors" viewport="700x150" name="Text" subtitle="Teks di atas Background dan Surface" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
.wrap{display:flex;gap:12px;padding:16px}
.panel{flex:1;border-radius:var(--radius-md);border:1px solid var(--pk-border);padding:14px 16px;display:flex;flex-direction:column;gap:4px}
</style></head><body>
<div class="wrap">
  <div class="panel" style="background:var(--pk-bg)">
    <span style="font:var(--text-body-md);color:var(--pk-text)">Text Primary — #F1F5F9</span>
    <span style="font:var(--text-body-sm);color:var(--pk-text-secondary)">Text Secondary — #94A3B8</span>
    <span style="font:var(--text-body-sm);color:var(--pk-text-disabled)">Disabled — #64748B</span>
  </div>
  <div class="panel" style="background:var(--pk-surface)">
    <span style="font:var(--text-body-md);color:var(--pk-text)">Text Primary di Surface</span>
    <span style="font:var(--text-body-sm);color:var(--pk-text-secondary)">Text Secondary di Surface</span>
    <span style="font:var(--text-body-sm);color:var(--pk-accent)">Link / aksi — #F97316</span>
  </div>
</div>
</body></html>
