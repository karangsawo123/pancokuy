<!-- @dsCard group="Motion" viewport="700x220" name="Durations & Easing" subtitle="micro 120ms · komponen 240ms · halaman/modal 360ms" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
body{padding:18px 24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 32px}
.item{display:flex;flex-direction:column;gap:8px}
.head{display:flex;justify-content:space-between;align-items:baseline}
.name{font:var(--text-label);color:var(--pk-text)}
.val{font:var(--text-caption);color:var(--pk-text-secondary);font-family:ui-monospace,monospace}
.track{height:8px;border-radius:var(--radius-pill);background:var(--pk-surface-raised);overflow:hidden;position:relative}
.fill{position:absolute;inset:0;width:0;background:var(--pk-accent);border-radius:var(--radius-pill)}
.note{font:var(--text-caption);color:var(--pk-text-secondary);margin-top:2px}
</style></head><body>
<div class="grid">
  <div class="item"><div class="head"><span class="name">Micro-interaction</span><span class="val">100–150ms</span></div><div class="track"><div class="fill" data-dur="120"></div></div><span class="note">hover, press, checkbox, toggle</span></div>
  <div class="item"><div class="head"><span class="name">Transisi komponen</span><span class="val">200–300ms</span></div><div class="track"><div class="fill" data-dur="240"></div></div><span class="note">card, dropdown, badge color, accordion</span></div>
  <div class="item"><div class="head"><span class="name">Halaman / modal</span><span class="val">300–400ms</span></div><div class="track"><div class="fill" data-dur="360"></div></div><span class="note">route change, modal, drawer</span></div>
  <div class="item" style="justify-content:center;gap:6px">
    <span class="name">Easing curve</span>
    <span class="val">--ease-out · masuk (0.16,1,0.3,1)</span>
    <span class="val">--ease-in · keluar (0.4,0,1,1)</span>
    <span class="val">--ease-spring · press pop (0.34,1.4,0.64,1)</span>
  </div>
</div>
<script>
const fills=[...document.querySelectorAll('.fill')];
function run(){fills.forEach(f=>{f.style.transition='none';f.style.width='0';});
requestAnimationFrame(()=>requestAnimationFrame(()=>{fills.forEach(f=>{const d=+f.dataset.dur;f.style.transition=`width ${d}ms cubic-bezier(0.16,1,0.3,1)`;f.style.width='100%';});}));}
run();setInterval(run,2200);
</script>
</body></html>
