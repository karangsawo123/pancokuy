<!-- @dsCard group="Motion" viewport="700x220" name="Skeleton, Badge & Toast" subtitle="Skeleton shimmer saat hitung WP · badge pending→accepted · toast masuk" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
body{padding:18px 24px;display:grid;grid-template-columns:1fr 1fr;gap:18px 24px;align-items:start}
.lab{font:var(--text-caption);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--pk-text-secondary);margin-bottom:8px}
.sk{height:14px;border-radius:6px;margin-bottom:8px;background:linear-gradient(90deg,var(--pk-surface-raised) 25%,var(--pk-border) 37%,var(--pk-surface-raised) 63%);background-size:400% 100%;animation:shimmer 1.4s ease-in-out infinite}
@keyframes shimmer{0%{background-position:100% 0}100%{background-position:-100% 0}}
.badge{display:inline-flex;align-items:center;gap:6px;border-radius:var(--radius-pill);padding:4px 12px;font:var(--text-caption);letter-spacing:var(--tracking-caps);text-transform:uppercase;
  transition:background var(--dur-component) var(--ease-in-out), color var(--dur-component) var(--ease-in-out)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.toast{display:flex;gap:10px;align-items:center;background:var(--pk-surface);border:1px solid var(--pk-border);border-left:3px solid var(--pk-success-fg);border-radius:var(--radius-md);padding:10px 12px;box-shadow:var(--elevation-3);
  opacity:0;transform:translateX(16px);animation:toastIn var(--dur-page) var(--ease-out) forwards}
@keyframes toastIn{to{opacity:1;transform:none}}
.toast b{font:var(--text-label);color:var(--pk-text)}
.toast span{font:var(--text-caption);color:var(--pk-text-secondary)}
</style></head><body>
<div>
  <div class="lab">Skeleton · hitung WP</div>
  <div class="sk" style="width:70%"></div>
  <div class="sk" style="width:100%"></div>
  <div class="sk" style="width:45%"></div>
</div>
<div>
  <div class="lab">Badge status (auto)</div>
  <span class="badge" id="bdg"><span class="dot"></span><span id="bt">Pending</span></span>
</div>
<div style="grid-column:1 / -1">
  <div class="lab">Toast · pengajuan sparing</div>
  <div class="toast" id="toast">
    <span style="color:var(--pk-success-fg)">✓</span>
    <div><b>Tantangan terkirim</b><br><span>Raka akan mendapat ajakan sparingmu.</span></div>
  </div>
</div>
<script>
const bdg=document.getElementById('bdg'),bt=document.getElementById('bt');
const states=[['Pending','var(--pk-warning-bg)','var(--pk-warning-fg)'],['Accepted','var(--pk-success-bg)','var(--pk-success-fg)'],['Rejected','var(--pk-error-bg)','var(--pk-error-fg)']];
let i=0;function setS(){const[t,bg,fg]=states[i];bdg.style.background=bg;bdg.style.color=fg;bt.textContent=t;i=(i+1)%states.length;}
setS();setInterval(setS,1500);
const toast=document.getElementById('toast');
setInterval(()=>{toast.style.animation='none';void toast.offsetWidth;toast.style.animation='toastIn var(--dur-page) var(--ease-out) forwards';},3000);
</script>
</body></html>
