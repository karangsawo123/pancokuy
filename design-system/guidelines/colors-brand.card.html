<!-- @dsCard group="Colors" viewport="700x150" name="Brand" subtitle="Primary steel + accent oranye" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
.row{display:flex;gap:12px;padding:16px}
.sw{flex:1;border-radius:var(--radius-md);border:1px solid var(--pk-border);padding:12px;height:86px;display:flex;flex-direction:column;justify-content:flex-end}
.sw b{font:var(--text-label);color:#fff}
.sw span{font:var(--text-caption);color:rgba(255,255,255,.75)}
</style></head><body>
<div class="row">
  <div class="sw" style="background:var(--pk-primary)"><b>Primary</b><span>#1E3A5F</span></div>
  <div class="sw" style="background:var(--pk-primary-hover)"><b>Primary Hover</b><span>#27496F</span></div>
  <div class="sw" style="background:var(--pk-accent)"><b style="color:#0F172A">Accent</b><span style="color:rgba(15,23,42,.7)">#F97316</span></div>
  <div class="sw" style="background:var(--pk-accent-hover)"><b style="color:#0F172A">Accent Hover</b><span style="color:rgba(15,23,42,.7)">#FB8A3C</span></div>
</div>
</body></html>
