<!-- @dsCard group="Motion" viewport="700x200" name="Hover & Press States" subtitle="Button: scale + glow oranye · Card: rise + shadow + border accent" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
body{padding:24px;display:flex;gap:20px;align-items:center}
.btn{border:none;border-radius:var(--radius-md);background:var(--pk-accent);color:var(--pk-text-on-accent);font:var(--text-button);height:44px;padding:0 22px;cursor:pointer;
  transition:transform var(--dur-micro) var(--ease-spring), box-shadow var(--dur-micro) var(--ease-out), background var(--dur-micro) var(--ease-out)}
.btn:hover{transform:scale(1.03);box-shadow:var(--elevation-accent);background:var(--pk-accent-hover)}
.btn:active{transform:scale(0.97);background:var(--pk-accent-active);box-shadow:none}
.card{flex:1;background:var(--pk-surface);border:1px solid var(--pk-border);border-radius:var(--radius-lg);padding:16px;box-shadow:var(--elevation-1);cursor:pointer;
  transition:transform var(--dur-component) var(--ease-out), box-shadow var(--dur-component) var(--ease-out), border-color var(--dur-component) var(--ease-out)}
.card:hover{transform:translateY(-4px);box-shadow:var(--elevation-2);border-color:var(--pk-accent)}
.card b{font:var(--text-h4);color:var(--pk-text);display:block;margin-bottom:4px}
.card span{font:var(--text-body-sm);color:var(--pk-text-secondary)}
.hint{font:var(--text-caption);color:var(--pk-text-secondary);text-align:center;display:block;margin-top:8px}
</style></head><body>
<div style="display:flex;flex-direction:column;align-items:center">
  <button class="btn">Cari Lawan</button>
  <span class="hint">hover = scale 1.03 + glow<br>press = scale 0.97 + darker</span>
</div>
<div class="card">
  <b>Raka Wijaya</b><span>Bandung · 78 kg · Top Roll — hover saya</span>
  <span class="hint" style="text-align:left">rise -4px + shadow 2 + border oranye</span>
</div>
</body></html>
