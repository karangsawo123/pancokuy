<!-- @dsCard group="Type" viewport="700x340" name="Type Scale" subtitle="Display 48 → Caption 12" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
.row{display:flex;align-items:baseline;gap:16px;padding:6px 0;border-bottom:1px solid var(--pk-border)}
.row:last-child{border-bottom:none}
.tok{font:var(--text-caption);color:var(--pk-text-secondary);width:120px;flex:none}
</style></head><body style="padding:14px 24px">
<div class="row"><span class="tok">--text-display</span><span style="font:var(--text-display);color:var(--pk-text)">Panco 48</span></div>
<div class="row"><span class="tok">--text-h1</span><span style="font:var(--text-h1);color:var(--pk-text)">Judul halaman 36</span></div>
<div class="row"><span class="tok">--text-h2</span><span style="font:var(--text-h2);color:var(--pk-text)">Section header 28</span></div>
<div class="row"><span class="tok">--text-h3</span><span style="font:var(--text-h3);color:var(--pk-text)">Card title 22</span></div>
<div class="row"><span class="tok">--text-body-md</span><span style="font:var(--text-body-md);color:var(--pk-text)">Body default 16</span></div>
<div class="row"><span class="tok">--text-label</span><span style="font:var(--text-label);color:var(--pk-text)">Label 14</span></div>
<div class="row"><span class="tok">--text-caption</span><span style="font:var(--text-caption);color:var(--pk-text-secondary);letter-spacing:var(--tracking-caps);text-transform:uppercase">Caption 12</span></div>
</body></html>
