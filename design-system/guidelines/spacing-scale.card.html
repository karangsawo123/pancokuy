<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="Skala 4px — --space-1..20" -->
<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>
.row{display:flex;align-items:flex-end;gap:20px;padding:20px 24px}
.it{display:flex;flex-direction:column;align-items:center;gap:6px}
.bar{background:var(--pk-primary);border-radius:3px;width:28px}
.it span{font:var(--text-caption);color:var(--pk-text-secondary)}
</style></head><body>
<div class="row">
  <div class="it"><div class="bar" style="height:4px"></div><span>4</span></div>
  <div class="it"><div class="bar" style="height:8px"></div><span>8</span></div>
  <div class="it"><div class="bar" style="height:12px"></div><span>12</span></div>
  <div class="it"><div class="bar" style="height:16px"></div><span>16</span></div>
  <div class="it"><div class="bar" style="height:24px"></div><span>24</span></div>
  <div class="it"><div class="bar" style="height:32px"></div><span>32</span></div>
  <div class="it"><div class="bar" style="height:48px"></div><span>48</span></div>
  <div class="it"><div class="bar" style="height:64px"></div><span>64</span></div>
  <div class="it"><div class="bar" style="height:80px;background:var(--pk-accent)"></div><span>80</span></div>
</div>
</body></html>
