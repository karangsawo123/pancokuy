<!DOCTYPE html><html><head><link rel="stylesheet" href="../styles.css">
<style>.row{display:flex;gap:16px;padding:16px;align-items:stretch}.p{border-radius:var(--radius-lg);border:1px solid var(--pk-border);display:flex;align-items:center;justify-content:center;background:var(--pk-surface)}</style>
</head><body>
<div class="row">
  <div class="p" style="flex:1.2;position:relative">
    <div style="border:1px dashed var(--pk-neutral);padding:30px">
      <img src="../assets/logo/pancokuy-icon-light.svg" style="height:104px;display:block" alt="Clear space icon PancoKuy">
    </div>
    <span style="position:absolute;bottom:8px;right:12px;font:var(--text-caption);color:var(--pk-text-secondary)">clear space 25%</span>
  </div>
  <div class="p" style="flex:1;gap:20px">
    <img src="../assets/logo/pancokuy-icon-light.svg" style="height:96px" alt="">
    <img src="../assets/logo/pancokuy-icon-light.svg" style="height:48px" alt="">
    <img src="../assets/logo/pancokuy-icon-light.svg" style="height:24px" alt="">
    <span style="font:var(--text-caption);color:var(--pk-text-secondary)">min 24px</span>
  </div>
  <div class="p" style="flex:.6">
    <div style="width:72px;height:72px;border-radius:50%;background:#0F172A;display:flex;align-items:center;justify-content:center"><img src="../assets/logo/pancokuy-icon-dark.svg" style="height:44px" alt="Avatar"></div>
  </div>
</div>
